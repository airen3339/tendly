name: Check
on:
  # Branches only: a release tag points at a commit already checked here, and
  # the release workflow builds it again anyway.
  push:
    branches: ['**']
  pull_request:

# A newer push to the same branch makes the running check moot.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  # Tests read panics, not a debugger: without debug info the compile and link
  # are faster and the cache below is a fraction of the size.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    strategy:
      # Each platform compiles code the others never see (cfg(unix),
      # cfg(windows)), so one failing must not hide what the others report.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # Dependencies are most of every build and change rarely. Keyed on the
      # lockfile and toolchain; saved from main only, so branches read it and
      # do not each store their own.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: pnpm/action-setup@v4
        with:
          version: '10.30.3'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The server embeds apps/web/dist, and rust-embed against a folder that
      # does not exist compiles to a struct with no iter/get rather than to an
      # error naming the folder. So the web build comes before anything cargo,
      # and what the Rust tests link is the real bundle.
      - run: pnpm build:web
      - run: pnpm typecheck:bridge
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: pnpm test
